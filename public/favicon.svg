<svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="faviconGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background for dark/light browser tab contrast -->
  <circle cx="50" cy="50" r="48" fill="#0B1120" />

  <!-- 360 Degree Orbital Compass Ring -->
  <circle cx="50" cy="50" r="42" stroke="url(#faviconGoldGrad)" stroke-width="2.5" stroke-dasharray="4 2.5" opacity="0.9" />

  <!-- 4 Cardinal Axis Markers -->
  <circle cx="50" cy="8" r="3.5" fill="#F59E0B" filter="url(#goldGlow)" />
  <circle cx="92" cy="50" r="3" fill="#F59E0B" />
  <circle cx="50" cy="92" r="3" fill="#F59E0B" />
  <circle cx="8" cy="50" r="3" fill="#F59E0B" />

  <!-- Inner Academic Crest Shield -->
  <rect x="20" y="20" width="60" height="60" rx="14" fill="url(#faviconBlueGrad)" stroke="#F59E0B" stroke-width="1.5" />

  <!-- Open Book Emblem -->
  <path d="M28 60C34 56 42 56 50 60C58 56 66 56 72 60V38C66 34 58 34 50 38C42 34 34 34 28 38V60Z" fill="#0F172A" stroke="#FDE047" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="50" y1="38" x2="50" y2="60" stroke="#FDE047" stroke-width="2" stroke-linecap="round" />

  <!-- Radiant Torch Emblem -->
  <path d="M50 24V32M45 27L50 22L55 27" stroke="#FDE047" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="50" cy="22" r="1.5" fill="#FDE047" />
</svg>
